<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="800" viewBox="0 0 1420 800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How yue2 runs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c94a0"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5b82e"/>
    </marker>
    <style>
      .box { fill: #161b24; stroke: #2a3140; stroke-width: 1.5; }
      .run { fill: #131a26; stroke: #3aa6f5; stroke-width: 1.5; }
      .panel { fill: none; stroke: #5a6272; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .t { fill: #eceef2; font-size: 15px; font-weight: 600; }
      .s { fill: #8c94a0; font-size: 12.5px; }
      .lane { fill: #eceef2; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .lane-s { fill: #8c94a0; font-size: 12px; }
      .flow { stroke: #8c94a0; stroke-width: 1.6; fill: none; }
      .report { stroke: #f5b82e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
      .label { fill: #8c94a0; font-size: 12px; }
      .label-y { fill: #f5b82e; font-size: 12px; }
      .note { fill: #8c94a0; font-size: 12px; font-style: italic; }
    </style>
  </defs>

  <rect width="1420" height="800" fill="#0e1117"/>

  <text x="60" y="62" fill="#eceef2" font-size="30" font-weight="700">How it runs</text>
  <text x="60" y="92" fill="#8c94a0" font-size="16">The same web app, queue and storage whether songs run on an always-on GPU worker or in one sandbox per song.</text>

  <!-- shared services -->
  <rect class="box" x="60" y="130" width="200" height="70" rx="10"/>
  <text class="t" x="160" y="171" text-anchor="middle">Browser</text>

  <rect class="box" x="340" y="130" width="300" height="70" rx="10"/>
  <text class="t" x="490" y="160" text-anchor="middle">Web app</text>
  <text class="s" x="490" y="182" text-anchor="middle">UI, API, job endpoints</text>

  <rect class="box" x="1100" y="130" width="260" height="70" rx="10"/>
  <text class="t" x="1230" y="160" text-anchor="middle">Lyric writer API</text>
  <text class="s" x="1230" y="182" text-anchor="middle">any OpenAI-compatible endpoint</text>

  <rect class="box" x="340" y="260" width="300" height="70" rx="10"/>
  <text class="t" x="490" y="290" text-anchor="middle">Postgres</text>
  <text class="s" x="490" y="312" text-anchor="middle">songs, progress, job queue</text>

  <rect class="box" x="720" y="260" width="300" height="70" rx="10"/>
  <text class="t" x="870" y="290" text-anchor="middle">Storage</text>
  <text class="s" x="870" y="312" text-anchor="middle">local folder, or Spaces / S3</text>

  <line class="flow" x1="260" y1="165" x2="336" y2="165" marker-end="url(#arrow)"/>
  <line class="flow" x1="490" y1="200" x2="490" y2="256" marker-end="url(#arrow)"/>
  <path class="flow" d="M640,165 H870 V256" marker-end="url(#arrow)"/>
  <text class="label" x="880" y="235">plays audio</text>

  <!-- where songs run -->
  <rect x="40" y="390" width="1340" height="330" rx="16" fill="#12161e"/>
  <text class="lane" x="60" y="430">RUNS SONGS</text>
  <text class="lane-s" x="60" y="450">either or both</text>

  <rect class="panel" x="200" y="410" width="440" height="220" rx="12"/>
  <text class="lane-s" x="220" y="436">Always on</text>
  <rect class="run" x="240" y="470" width="360" height="80" rx="10"/>
  <text class="t" x="420" y="504" text-anchor="middle">Worker</text>
  <text class="s" x="420" y="528" text-anchor="middle">GPU Droplet or any VM, claims songs itself</text>

  <rect class="panel" x="680" y="410" width="680" height="260" rx="12"/>
  <text class="lane-s" x="1340" y="436" text-anchor="end">Job per song (YUE2_RUNNER)</text>
  <rect class="run" x="720" y="450" width="600" height="64" rx="10"/>
  <text class="t" x="1020" y="478" text-anchor="middle">Dispatcher</text>
  <text class="s" x="1020" y="500" text-anchor="middle">claims a song, starts a job, retries it if the job dies</text>

  <rect class="run" x="720" y="570" width="180" height="80" rx="10"/>
  <text class="t" x="810" y="604" text-anchor="middle">Modal</text>
  <text class="s" x="810" y="626" text-anchor="middle">GPU sandbox</text>
  <rect class="run" x="930" y="570" width="180" height="80" rx="10"/>
  <text class="t" x="1020" y="604" text-anchor="middle">CoreWeave</text>
  <text class="s" x="1020" y="626" text-anchor="middle">GPU sandbox</text>
  <rect class="run" x="1140" y="570" width="180" height="80" rx="10"/>
  <text class="t" x="1230" y="604" text-anchor="middle">Local process</text>
  <text class="s" x="1230" y="626" text-anchor="middle">for development</text>

  <line class="flow" x1="1020" y1="514" x2="810" y2="566" marker-end="url(#arrow)"/>
  <line class="flow" x1="1020" y1="514" x2="1020" y2="566" marker-end="url(#arrow)"/>
  <line class="flow" x1="1020" y1="514" x2="1230" y2="566" marker-end="url(#arrow)"/>

  <!-- queue, audio and lyrics -->
  <line class="flow" x1="420" y1="470" x2="420" y2="334" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="370">claims songs, writes progress</text>
  <path class="flow" d="M760,450 V360 H600 V334" marker-end="url(#arrow)"/>
  <text class="label" x="770" y="380">claims songs</text>
  <line class="flow" x1="960" y1="390" x2="960" y2="334" marker-end="url(#arrow)"/>
  <text class="label" x="970" y="366">saves audio</text>
  <line class="flow" x1="1230" y1="390" x2="1230" y2="204" marker-end="url(#arrow)"/>
  <text class="label" x="1240" y="300">writes lyrics</text>

  <!-- jobs report progress over HTTPS -->
  <path class="report" d="M810,650 V685"/>
  <path class="report" d="M1020,650 V685"/>
  <path class="report" d="M1230,650 V685 H180 V230 H400 V204" marker-end="url(#arrow-yellow)"/>
  <text class="label-y" x="220" y="707">jobs report progress to the web app over HTTPS, with a token for their song (the database stays private)</text>

  <text class="note" x="60" y="765">Set YUE2_RUNNER to pick modal, coreweave or process. The worker and the dispatcher can share one queue.</text>
</svg>
